@if (cargando()) {
  <p>Cargando contactos...</p>
} @else {
  <h2>Mis contactos</h2>

  <app-contact-form
    (agregar)="agregarContacto($event)">
  </app-contact-form>

  <app-contact-list
    [contactos]="contactos()"
    (eliminar)="eliminarContacto($event)">
  </app-contact-list>
}

<router-outlet />
