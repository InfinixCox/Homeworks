<section class="tarjeta-perfil">
  <h2>Mi perfil</h2>

  <p>{{ auth.session()?.user?.email }}</p>

  @if (url() !== '') {
    <img class="avatar" [src]="url()" alt="Foto de perfil">
  } @else {
    <div class="sin-avatar">Sin foto</div>
  }

  <label class="subir">
    Cambiar foto
    <input
      type="file"
      accept="image/png, image/jpeg, image/webp, image/gif"
      (change)="subir($event)"
      [disabled]="pendiente()"
    >
  </label>

  @if (pendiente()) {
    <p>Subiendo imagen...</p>
  }

  @if (mensaje() !== '') {
    <p class="mensaje">{{ mensaje() }}</p>
  }
</section>
