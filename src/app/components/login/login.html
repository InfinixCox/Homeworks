<main class="container py-5">
  <h1 class="text-center mb-4">
    Explorador de carpetas y archivos - Parcial 02
  </h1>

  <section class="login mx-auto">
    <h2 class="h4 mb-3">Acceso</h2>

    <div class="mb-3">
      <label for="correo" class="form-label">
        Correo electrónico
      </label>

      <input
        id="correo"
        type="email"
        class="form-control"
        [ngModel]="correo()"
        (ngModelChange)="correo.set($event)"
        [disabled]="pendiente()"
      >
    </div>

    <div class="mb-3">
      <label for="clave" class="form-label">
        Contraseña
      </label>

      <input
        id="clave"
        type="password"
        class="form-control"
        [ngModel]="clave()"
        (ngModelChange)="clave.set($event)"
        [disabled]="pendiente()"
      >
    </div>

    <div class="d-flex gap-2">
      <button
        type="button"
        class="btn btn-primary"
        (click)="entrar()"
        [disabled]="pendiente()"
      >
        Iniciar sesión
      </button>

      <button
        type="button"
        class="btn btn-outline-secondary"
        (click)="registrar()"
        [disabled]="pendiente()"
      >
        Crear cuenta
      </button>
    </div>

    @if (pendiente()) {
      <p class="mt-3">Procesando...</p>
    }

    @if (mensaje() !== '') {
      <p class="text-danger mt-3">{{ mensaje() }}</p>
    }
  </section>
</main>
